<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web02_Josefa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .outer-box {
            width: 380px;
            height: 180px;
            padding: 10px;
            border: 2px solid #888;
            background-color: #f1f1f1;
            overflow: auto;
        }
        .form-row {
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
        }
        .form-row label {
            width: 85px;
            font-size: 14px;
            padding-top: 3px;
        }
        .form-row input[type="text"],
        .form-row textarea {
            border: 1px solid #7f9db9;
            padding: 3px 5px;
            font-family: monospace;
            font-size: 13px;
            background-color: #ffffff;
        }
        .form-row input[type="text"] {
            width: 250px;
        }
        .form-row textarea {
            width: 250px;
            height: 75px;
            resize: none;
        }
    </style>
</head>
<body>
    <div class="outer-box">
        <form action="/action_page.php">
            
            <div class="form-row">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="tulis nama kamu disini">
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" placeholder="tulis email kamu disini">
            </div>

            <div class="form-row">
                <label for="address">Address:</label>
                <textarea id="address" name="address" placeholder="Nowhere Street
Somewhere
Not Here
Y2K 5RU" ></textarea>
            </div>
            <div class="form-row">
                <label for="postcode">Postcode:</label>
                <input type="text" id="postcode" name="postcode" placeholder="kode post">
            </div>
        </form>
    </div>
</body>
</html>
